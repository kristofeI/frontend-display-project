<header class="navbar">
  <nav class="navbar__inner">
    <ul class="navbar__links" [class.navbar__links--open]="menuOpen()">
      <li>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
      </li>
      <li>
        <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About Me</a>
      </li>
      <li>
        <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a>
      </li>
    </ul>

    <button class="navbar__burger" (click)="toggleMenu()" aria-label="Toggle menu">
      @if (menuOpen()) {
        <span class="navbar__burger-icon">&#x2715;</span>
      } @else {
        <span class="navbar__burger-icon">&#9776;</span>
      }
    </button>
  </nav>
</header>
